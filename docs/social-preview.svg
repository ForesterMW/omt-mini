<text x="292" y="188" font-family="DejaVu Sans" font-weight="bold" font-size="84" fill="#E8EAED">OMT Mini</text>
<text x="294" y="242" font-family="DejaVu Sans" font-size="26" fill="#9AA2AF">Every Open Media Transport</text>
<text x="294" y="278" font-family="DejaVu Sans" font-size="26" fill="#9AA2AF">tool for Windows, in one tray icon.</text>
<text x="76" y="364" font-family="DejaVu Sans" font-weight="bold" font-size="24" fill="#E8EAED">A free NDI Tools alternative for the open OMT protocol.</text>
<text x="76" y="402" font-family="DejaVu Sans" font-size="20" fill="#9AA2AF">Viewer, multiviewer, screen capture, virtual webcam, control panel.</text>
<text x="76" y="434" font-family="DejaVu Sans" font-size="20" fill="#9AA2AF">1 MB. No admin rights. MIT.</text>
