name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cross-build:
    name: Windows x64 (mingw cross)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 cmake zip

      - name: Fetch the OMT runtime
        run: ./scripts/fetch-omt.sh

      - name: Build
        run: VERSION=0.0.0-ci ./scripts/cross-build.sh

      - name: Package
        run: VERSION=0.0.0-ci ./scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: omt-mini-ci
          path: dist/*
          retention-days: 14
